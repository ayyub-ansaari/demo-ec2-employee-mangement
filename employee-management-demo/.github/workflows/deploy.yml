
  name: Build and Deploy Employee Management Demo

  on:
    push:
      branches: ["main"]
    workflow_dispatch:

  jobs:
    ci:
      name: Validate Application
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: "22"
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Check backend JavaScript syntax
          run: node --check server.js

        - name: Build Docker image
          run: docker build -t employee-management-demo:${{ github.sha }} .

    deploy:
      name: Deploy to AWS EC2
      needs: ci
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Copy project to EC2
          uses: appleboy/scp-action@v0.1.7
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            source: "."
            target: "/home/${{ secrets.EC2_USER }}/employee-management-demo"
            overwrite: true
            rm: false
            strip_components: 0
            exclude: ".git,.github"

        - name: Build and restart application on EC2
          uses: appleboy/ssh-action@v1.2.0
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              set -e
              cd /home/${{ secrets.EC2_USER }}/employee-management-demo
              docker compose up -d --build
              docker image prune -f
    
